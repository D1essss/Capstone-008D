<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    
    <link rel="stylesheet" href="../css/estilo_principal.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="background-slideshow">
    </div>
    <div class="login-wrapper"> <div class="login-container">
            <img src="../IMG/logo qorden.png" alt="Logo de la empresa" class="login-logo">
            <h2 class="login-title">Iniciar Sesión</h2>
            
            <form class="login-form" action="html/index.html" method="get">
            <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email-input" placeholder="Correo electrónico">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password-input" placeholder="Contraseña">
                </div>
                <button class="login-btn" id="loginBtn" type="button">Ingresar</button>
                <p id="error-message" style="color: red;"></p>
            </form>
        </div>
    </div>
    <script type="module" src="../renderer.js"></script>
</body>
</html>
