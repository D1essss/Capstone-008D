<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    
    <link rel="stylesheet" href="../css/estilo_principal.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="background-slideshow">
    </div>
    <div class="login-wrapper">
    <div class="login-container">

        <img src="../IMG/logo qorden.png" alt="Logo de la empresa" class="login-logo">
        
        <form class="login-form" id="loginForm"> 
            
            <h2 class="login-title">Iniciar Sesión</h2>

            <div class="input-group">
                <label for="email-input">Correo electrónico</label>
                <input type="email" id="email-input" placeholder="Correo electrónico">
            </div>
            <div class="input-group">
                <label for="password-input">Contraseña</label>
                <input type="password" id="password-input" placeholder="Contraseña">
            </div>
            
             <div class="login-options">
                <a href="#" id="forgotPasswordLink" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
            </div>

           

            <button class="login-btn" id="loginBtn" type="button">Ingresar(Prueba actualizador)</button>
            <p id="error-message" class="error-message"></p> </form>



        <form class="login-form" id="resetForm" style="display: none;">
            
            <h2 class="login-title">Recuperar Contraseña</h2>
            
            <p class="reset-instructions">
                Ingresa tu correo y te enviaremos un enlace para recuperar tu cuenta.
            </p>

            <div class="input-group">
                <label for="reset-email-input">Correo electrónico</label>
                <input type="email" id="reset-email-input" placeholder="Correo electrónico">
            </div>

            <button class="login-btn" id="resetBtn" type="button">Enviar Enlace</button>
            <p id="reset-message" class="reset-message"></p> <a href="#" id="backToLoginLink" class="back-link">Volver a Iniciar Sesión</a>
        </form>

    </div>
</div>

<script src="../renderer.js" type="module"></script>
</body>
</html>
