<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - QRDEN</title>
    <link rel="stylesheet" href="../css/estilo_principal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-box-open icon-logo"></i>
            </div>
            <nav class="sidebar-nav">
   <nav class="sidebar-nav">
    <ul>
        <li><a href="#" onclick="handleNav('dashboard.html', this)" class="nav-item"><i class="fas fa-chart-line nav-icon"></i> Dashboard</a></li>
        <li><a href="#" onclick="handleNav('index.html', this)" class="nav-item active"><i class="fas fa-box nav-icon"></i> Inventario</a></li> 
        <li><a href="#" onclick="handleNav('perfil.html', this)" class="nav-item"><i class="fas fa-user nav-icon"></i> Perfil</a></li> 
    </ul>
</nav>
</nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Qrden</h1>
                <button  id="btn-registrar-empleado" class="add-product-btn" onclick="window.electronAPI.navigate('registro.html')">Registrar Nuevo Usuario</button>
            </header>

            


          <div class="tabs-container">
  <button class="tab-button is-active" data-tab="inventario">Inventario</button>
  <button class="tab-button" data-tab="historial">Historial de Movimientos</button>
  <button class="tab-button" data-tab="personal" id="tab-personal-btn" >Gestionar Personal</button>
</div>

<div class="tab-content-container">
  <div id="inventario" class="tab-content is-active">
    <h2>Inventario de Productos</h2>
    <div class="container mt-4 mb-4">
  <input type="text" id="buscador" class="form-control" placeholder="Buscar producto por nombre...">
</div>
<div class="filter-controls">
  <label for="category-filter">Filtrar por Categoría:</label>
  <select id="category-filter" class="filter-select">
    <option value="all" selected>Todas las categorías</option>
    </select>
  <button id="apply-filter-btn" class="filter-button">Aplicar Filtro</button>
  <button id="clear-filter-btn" class="filter-button secondary-filter-button">Limpiar Filtro</button>
</div>

<div class="container" id="lista-productos">
  </div>
  
    <table class="product-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Stock</th>
          <th>Precio(CLP)</th>
          <th>Fecha de Ingreso</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody id="product-table-body">
        </tbody>
    </table>
  </div>

  <div id="historial" class="tab-content">
  <h2>Historial de Movimientos</h2>
  <table class="product-table">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Responsable</th>
        <th>Tipo</th>
        <th>Cantidad</th>
        <th>Fecha</th>
        <th>Ubicación</th> </tr>
    </thead>
    <tbody id="registro-table-body">
    </tbody>
  </table>
</div>
<div id="personal" class="tab-content">
  <h2>Gestión de Empleados</h2>
  
  <table class="inventory-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Cargo</th>
        <th>Email</th>
        <th>Estado</th> 
        <th>Acción</th> </tr>
    </thead>
    <tbody id="employees-table-body">
      </tbody>
  </table>
</div>
        </main>
    </div>
<script  src="../nav-script.js"></script>
<script src="../renderer.js" type="module"></script>
</body>
</html>
