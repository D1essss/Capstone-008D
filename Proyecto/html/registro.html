<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Empleado</title>
  <link rel="stylesheet" href="../css/estilo_principal.css">
</head>
<body>
  
  <div class="login-wrapper">
    <div class="login-container">
      
      <h2 class="login-title">Registrar Empleado</h2>
      
      <div class="login-form">
        <div class="input-group">
          <label for="nombre-input">Nombre</label>
          <input type="text" id="nombre-input">
        </div>
        
        <div class="input-group">
          <label for="apellido-input">Apellido</label>
          <input type="text" id="apellido-input">
        </div>
        
        <div class="input-group">
          <label for="cargo-input">Cargo</label>
          <input type="text" id="cargo-input">
        </div>
        
        <div class="input-group">
          <label for="email-input">Correo Electrónico</label>
          <input type="email" id="email-input">
        </div>

        <div class="input-group">
          <label for="password-input">Contraseña</label>
          <input type="password" id="password-input">
        </div>
        
        <button id="registerBtn" type="button" class="login-btn">Registrar</button>
        
        <p id="message" style="color: green; margin-top: 15px;"></p>
        
        <a href="#" onclick="window.electronAPI.navigate('index.html')" style="margin-top: 15px;">Volver al Inventario</a>
      </div>

    </div>
  </div>

  <script src="../registro-renderer.js" type="module"></script>
</body>
</html>
