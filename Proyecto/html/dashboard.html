<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../css/estilo_principal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-box-open icon-logo"></i>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="nav-item active" onclick="window.electronAPI.navigate('dashboard.html')"><i class="fas fa-chart-line nav-icon"></i> Dashboard</a></li>
          <li><a href="#" class="nav-item" onclick="window.electronAPI.navigate('index.html')"><i class="fas fa-box nav-icon"></i> Inventario</a></li>
          <li><a href="#" class="nav-item" onclick="window.electronAPI.navigate('perfil.html')"><i class="fas fa-user nav-icon"></i> Perfil</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <h1>Dashboard de Bodega</h1>
      </div>
      
       <div class="dashboard-grid">
        <div class="chart-card">
          <h3>Top 5 Productos con Más Movimiento (Unidades)</h3>
          <canvas id="topProductsChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Entradas vs. Salidas</h3>
          <canvas id="entryExitChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Top Empleado por Movimientos</h3>
          <canvas id="employeeMovementsChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Movimiento de Productos por Día</h3>
          <canvas id="dailyMovementsChart"></canvas>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../dashboard-renderer.js" type="module"></script>
</body>
</html>
