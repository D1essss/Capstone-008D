<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="../css/estilo_principal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-box-open icon-logo"></i>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="nav-item" onclick="window.electronAPI.navigate('dashboard.html')"><i class="fas fa-chart-line nav-icon"></i> Dashboard</a></li>
          <li><a href="#" class="nav-item" onclick="window.electronAPI.navigate('index.html')"><i class="fas fa-box nav-icon"></i> Inventario</a></li>
          <li><a href="#" class="nav-item active"><i class="fas fa-user nav-icon"></i> Perfil</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <h1>Perfil de Usuario</h1>
      </div>
      
      <div class="profile-section">
  <div class="profile-card expanded-profile-card"> <div class="profile-avatar-initials" id="user-initials">JP</div>
    <div class="profile-header">
      <h2 id="user-name">Cargando...</h2>
      <p id="user-role" class="profile-role">...</p>
    </div>
    <div class="profile-details">
      <div class="detail-item">
        <i class="fas fa-envelope detail-icon"></i>
        <strong><h2tmlFor="user-email">Correo:</h2></strong>
        <span id="user-email">...</span>
      </div>
      <div class="detail-item">
        <i class="fas fa-id-card detail-icon"></i>
        <strong><h2tmlFor="user-rut">RUT:</h2></strong>
        <span id="user-rut">...</span>
      </div>
      <div class="detail-item">
        <i class="fas fa-phone detail-icon"></i>
        <strong><h2tmlFor="user-phone">Teléfono:</h2></strong>
        <span id="user-phone">...</span>
      </div>
    </div>
    <div class="preferences-section"> 
<h3>PIN de Seguridad (2FA)</h3>
<div id="pin-disabled-section">
 <p>Añade una capa extra de seguridad a tu cuenta con un PIN de 6 dígitos.</p>
 <button id="createPinBtn" class="login-btn">Crear PIN de Seguridad</button>
</div>

 <div id="pin-enabled-section" style="display: none;">
 <p style="color: var(--status-en-stock-text); font-weight: bold;">¡PIN de Seguridad HABILITADO!</p>
 <button id="changePinBtn" class="login-btn">Cambiar PIN</button>
 <button id="removePinBtn" class="logout-btn" style="margin-left: 10px;">Eliminar PIN</button>
 </div>

 <div id="pin-setup-section" style="display: none; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
 <h4 id="pin-setup-title">Crear tu PIN de Seguridad</h4>
 <div class="form-group">
<label for="new-pin-input">Nuevo PIN (6 dígitos numéricos)</label>
 <input type="password" id="new-pin-input" placeholder="●●●●●●" maxlength="6">
 </div>
 <div class="form-group">
 <label for="confirm-pin-input">Confirmar Nuevo PIN</label>
 <input type="password" id="confirm-pin-input" placeholder="●●●●●●" maxlength="6">
 </div>
 <button id="savePinBtn" class="login-btn">Guardar PIN</button>
 <button id="cancelPinBtn" class="logout-btn" style="background-color: var(--text-light); margin-left: 10px;">Cancelar</button>

 <p id="pin-error-message" style="color: var(--danger-color); margin-top: 10px;"></p>
 </div>
</div>
    
    <div class="profile-actions">
        <button id="changePasswordBtn" class="save-changes-btn full-width">
            <i class="fas fa-key"></i> Cambiar Contraseña
        </button>
        <button id="logoutBtn" class="logout-btn full-width">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </button>
    </div>
    <p id="password-message" style="margin-top: 10px; text-align: center;"></p>
  </div>
</div>

<div id="changePasswordModal" class="modal">
  <div class="modal-content">
    <span class="close-button">&times;</span>
    <h2>Cambiar Contraseña</h2>
    <div class="input-group">
      <label for="current-password-input">Contraseña Actual</label>
      <input type="password" id="current-password-input">
    </div>
    <div class="input-group">
      <label for="new-password-input">Nueva Contraseña</label>
      <input type="password" id="new-password-input">
    </div>
    <div class="input-group">
      <label for="confirm-new-password-input">Confirmar Nueva Contraseña</label>
      <input type="password" id="confirm-new-password-input">
    </div>
    <button id="confirmChangePasswordBtn" class="login-btn">Confirmar Cambio</button>
    <p id="modal-password-message" style="margin-top: 15px;"></p>
  </div>
</div>
  <script src="../perfil-renderer.js" type="module"></script>
</body>
</html>
