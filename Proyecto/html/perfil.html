<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Aplicación</title>
    <link rel="stylesheet" href="/Proyecto/css/estilo_perfil.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-cube icon-logo"></i>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="nav-item"><i class="fas fa-chart-line nav-icon"></i> Dashboard</a></li>
                    <li><a href="/Proyecto/html/index.html" class="nav-item"><i class="fas fa-box nav-icon"></i> Inventario</a></li>
                    <li><a href="/Proyecto/html/perfil.html" class="nav-item active"><i class="fas fa-user nav-icon"></i> Perfil</a></li> <li><a href="#" class="nav-item"><i class="fas fa-cog nav-icon"></i> Configuración</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Perfil de Usuario</h1>
            </header>

            <section class="profile-section">
                <div class="profile-card">
                    <div class="profile-header">
                        <img src="/Proyecto/IMG/perfil.webp" alt="Avatar de Usuario" class="profile-avatar">
                        <h2>Juan Pérez</h2>
                        <p class="profile-role">Administrador de Inventario</p>
                    </div>
                    <div class="profile-details">
                        <div class="detail-item">
                            <i class="fas fa-envelope detail-icon"></i>
                            <span>juan.perez@empresa.com</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-phone detail-icon"></i>
                            <span>+34 678 123 456</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar-alt detail-icon"></i>
                            <span>Miembro desde: 15/03/2022</span>
                        </div>
                    </div>
                </div>

                <div class="settings-card">
                    <h3>Configuración de la Cuenta</h3>
                    <form class="profile-form">
                        <div class="form-group">
                            <label for="full-name">Nombre Completo</label>
                            <input type="text" id="full-name" value="Juan Pérez">
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" value="juan.perez@empresa.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Cambiar Contraseña</label>
                            <input type="password" id="password" placeholder="********">
                        </div>
                        <button type="submit" class="save-changes-btn">Guardar Cambios</button>
                    </form>

                    <button class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
